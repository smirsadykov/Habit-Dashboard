<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Day Desk → Гиря</title>
<!-- if the script can't run, still get there -->
<meta http-equiv="refresh" content="3; url=https://smirsadykov.github.io/KB-daily/">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0d1117;color:#e8edf3;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:24px;text-align:center}
  a{color:#ff7a1a}
</style>
</head>
<body>
<p>Day Desk переехал во вкладку «День» приложения <b>Гиря</b>.<br>
  Все отметки на месте. <a href="https://smirsadykov.github.io/KB-daily/">Открыть</a></p>
<script>
/* Day Desk now lives inside Гиря (smirsadykov.github.io/KB-daily/), whose «День»
   tab reads the same localStorage, so nothing needs moving. Retire this app's
   own worker and offline copy — only this app's, never a neighbour's — then go. */
(async () => {
  try {
    const scope = new URL("./", location.href).href;
    for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope === scope) await r.unregister();
    for (const k of await caches.keys()) if (k.startsWith("daydesk-")) await caches.delete(k);
  } catch (e) { /* go anyway */ }
  location.replace("https://smirsadykov.github.io/KB-daily/");
})();
</script>
</body>
</html>
